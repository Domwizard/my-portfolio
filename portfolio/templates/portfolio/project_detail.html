{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="{% static 'portfolio/favicon.png' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.title }} — Проект</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'portfolio/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top py-3 mb-5">
    <div class="container">
        <a class="navbar-brand fs-4" href="/">← Назад</a>
        <button id="theme-toggle" class="btn btn-outline-custom btn-sm">🌙 Тема</button>
    </div>
</nav>

<div class="container pb-5">
    <div class="glass-card p-4 p-md-5">
        <span class="project-tech mb-3 fs-6">{{ project.tech }}</span>
        <h1 class="display-5 fw-bold mb-4" style="letter-spacing: -1px;">{{ project.title }}</h1>
        
        {% if project.photo %}
            <img src="{{ project.photo.url }}" class="img-fluid rounded-4 mb-4 w-100 shadow-sm" alt="{{ project.title }}">
        {% endif %}
        
        <div class="bio-text mb-5" style="font-size: 1.15rem; line-height: 1.8;">
            {{ project.description|linebreaks }}
        </div>
        
        <div class="d-flex flex-wrap gap-3 border-top pt-4" style="border-color: var(--border) !important;">
            {% if project.url %}
                <a href="{{ project.url }}" target="_blank" class="btn btn-primary-custom w-100 w-md-auto">Открыть сайт</a>
            {% endif %}
            <a href="/" class="btn btn-outline-custom w-100 w-md-auto">Вернуться назад</a>
        </div>
    </div>
</div>

<footer class="text-center py-5 mt-5 border-top">
    <div class="container text-muted">
        <p class="mb-0">&copy; {% now "Y" %} Портфолио. Сделано на Python & Django.</p>
    </div>
</footer>

<script>
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;
    
    if (localStorage.getItem('theme') === 'dark') {
        body.classList.add('dark-theme');
        toggleBtn.innerText = '☀️ Тема';
    }

    toggleBtn.addEventListener('click', () => {
        body.classList.toggle('dark-theme');
        if (body.classList.contains('dark-theme')) {
            localStorage.setItem('theme', 'dark');
            toggleBtn.innerText = '☀️ Тема';
        } else {
            localStorage.setItem('theme', 'light');
            toggleBtn.innerText = '🌙 Тема';
        }
    });
</script>
</body>
</html>
